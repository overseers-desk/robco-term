[package]
name = "robco-app"
# The product's version lives in the workspace manifest, which is also where
# `xtask dist` and `xtask stage-deb` read it from. Inheriting it here is what makes
# `app::VERSION` (and so `--version`) and the version stamped on a release
# artifact the same string without a second place to remember.
version.workspace = true
edition = "2021"
rust-version = "1.96.1"
description = "RobCo Terminal application: the CLI contract, the single-instance shell, the winit window and its wgpu surface, the event loop driving a term session, input encoding, and the live settings handle."
license = "MIT"
publish = false

# The binary's own basename is the application's identity (WM_CLASS, the
# instance lock, the settings store), so a renamed copy runs side by side
# with the stock one. Renaming this `[[bin]]` therefore renames the whole
# identity, on purpose.
[[bin]]
name = "robco-term"
path = "src/main.rs"

# The settings window, linked into this binary instead of shipped beside it:
# one exe for Windows, where a directory of files beside the terminal is a
# thing users lose. Off by default, and a build without it is the build this
# repository has always produced -- same code paths, same spawn of the
# companion `robco-settings`, no C compiler needed. Turning it on is only
# meaningful on Windows and only after `settings/zipfs/build-selfcontained.ps1
# -Embed` has laid out the Tcl/Tk libraries and the payload zip the build
# script reads out of the environment.
[features]
default = []
embedded-settings = []

[target.'cfg(windows)'.build-dependencies]
cc = "1"

[lib]
name = "app"
path = "src/lib.rs"

[dependencies]
robco-ssh-link = { path = "../ssh-link" }
# The `~/.ssh/config` parser, from the same family as the pinned russh, so
# the file's `Host` patterns, negations and merge order are one crate's
# reading rather than this repository's guess at OpenSSH's. What it hands
# back is only what it knows to name, which is why `crate::ssh_config` also
# reads the matched block as text: see that module for the whole rule.
russh-config = "0.58"
# The glob `russh-config` matches `Host` patterns with. A direct dependency
# because the text pass beside it must agree with the parse about which
# blocks apply to a host, and agreement is cheapest when it is the same
# matcher.
globset = "0.4"
robco-core = { path = "../core" }
# The feature set this crate's surface device is created with. The CRT chain
# runs on that device and both features it wants have to be asked for at
# creation, so the answer comes from the crate that owns it.
robco-gpu = { path = "../gpu" }
# The control-mode protocol codec, reached as `tmux_cc`: what the gateway in
# `crate::tmux` speaks through. Protocol only; the session/window policy the
# codec refuses to hold lives here, in the gateway.
robco-tmux-cc = { path = "../tmux-cc" }
# The config crate's lib is `config`, so it is reached under that name.
robco-config = { path = "../config" }
# The cabinet the screen is set into, reached as `chassis`: the bank's
# geometry, the seam, and the minimum-size floor the window hint is built on.
robco-chassis = { path = "../chassis" }
# What crosses the glass every so often, reached as `critters`: the art, and
# the clock that decides when. It holds no renderer and no terminal, so the
# window asks it for cells and stamps them itself.
robco-critters = { path = "../critters" }
# The CRT pass graph, reached as `crt`: what the wgpu device has to be
# created with, and the chain the window draws its grid through on the way to
# the swapchain.
robco-crt-render = { path = "../crt-render" }
# wgpu is pinned to exactly 30.0.0 by librashader 0.12 (Wave 0, S1). Do not
# float this: a minor bump breaks the shader chain, not just this crate.
wgpu = "=30.0.0"
# Default features stay on: the event loop needs a platform backend.
winit = "0.30"
libc = "0.2"
# `regex::escape` alone, for the find line: what the user types is looked for
# literally, so the query is escaped before it reaches rio-vt's regex search.
# The same version `robco-core` pins, and already in the graph through it, so
# this is a name for a dependency rather than a new one.
regex = "1.13"
directories = "5"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
notify = "8"
arboard = "3"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# The usable desktop, which winit does not report: it answers with the
# monitor's own rectangle and nothing takes a panel's strut off it. The
# X11 root window carries `_NET_WORKAREA`, which is the value a panel
# publishes for exactly this question, and this reads it. Already in the
# lock file through winit's own X11 backend and through arboard, so it
# costs a dependency line rather than a download.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

# The application menu (`crate::menu`): the bar macOS draws for every
# application, which is where a Mac expects Settings and Command-comma to
# be. This is the objc2 generation winit 0.30.13 itself links, so the types
# interconvert with anything winit hands back and the crates are already in
# the lock file, costing three dependency lines rather than a download.
# `NSResponder` is not decoration: `NSApplication` is declared behind it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
] }

[dev-dependencies]
# The known_hosts fixtures mint their own throwaway keys; the rand
# generation matches the one russh's key types are built against. The
# ssh flow test drives the in-process far side ssh-link's suite shares.
rand = { version = "0.10", features = ["thread_rng"] }
robco-ssh-link = { path = "../ssh-link", features = ["test-server"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
robco-shader-oracle = { path = "../shader-oracle" }
serde_json = "1"
tempfile = "3"
# The machine-wide device lock and the offscreen readback, and the librashader
# rig that mounts a single pass on them: `tests/suite/bank_column.rs` mounts the
# casting on a real device with no window, the same way `robco-chassis`'s own
# shader tests do.
robco-gpu = { path = "../gpu", features = ["harness"] }
robco-crt-render = { path = "../crt-render", features = ["harness"] }
