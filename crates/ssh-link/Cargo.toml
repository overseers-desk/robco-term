[package]
name = "robco-ssh-link"
version.workspace = true
edition = "2021"
rust-version = "1.96.1"
description = "The SSH transport: one thread per connection, bytes to the event loop"
license = "MIT"

[lib]
name = "ssh_link"
path = "src/lib.rs"

# russh refuses to build without one of its two C crypto backends (`ring` or
# `aws-lc-rs`); `ring` is the smaller build and both link statically, so the
# install section's claim that the binary carries what it needs stands. No
# `flate2`: compression saves wire bytes this program never notices. `rsa`
# stays: RSA identities are what half the world's agents still hold.
[dependencies]
russh = { version = "=0.63.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "net", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
rand = { version = "0.10", features = ["thread_rng"], optional = true }

# The suite runs a russh server in-process over loopback, and an agent over
# a Unix socket in a tempdir: no daemon, no gate, nothing to skip on.
# `test-server` compiles an in-process far side (a russh server on loopback
# and an agent on a Unix socket) for this crate's suite and the app's;
# nothing of it reaches a shipped binary.
[features]
test-server = ["dep:tokio-stream", "dep:rand"]

[dev-dependencies]
robco-ssh-link = { path = ".", features = ["test-server"] }
rand = { version = "0.10", features = ["thread_rng"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
