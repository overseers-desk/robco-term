[package]
name = "robco-gpu"
version.workspace = true
edition = "2021"
rust-version = "1.96.1"
description = "RobCo Terminal wgpu device concerns: the feature set every device the CRT chain runs on is created with, the offscreen colour target the grid is drawn into and read back from, and, behind the `harness` feature, the machine-wide device lock the GPU-backed tests hold."
license = "MIT"
publish = false

[lib]
name = "gpu"
path = "src/lib.rs"

[features]
# The test-only half: a device that holds the machine-wide GPU lock for its
# whole life, and the frame helpers the shader tests build their input with.
# Off by default, so a shipped binary links the offscreen target and the
# feature set and nothing else.
harness = []

[dependencies]
# Exactly 30.0.0: librashader 0.12 links this version, and a wgpu::Device from
# any other is a different, incompatible type at the FilterChain boundary.
# Nothing here uses librashader, but everything here hands its device to it.
wgpu = "=30.0.0"
pollster = "0.4"
