[package]
name = "robco-critters"
version.workspace = true
edition = "2021"
rust-version = "1.96.1"
description = "The critters: eight pieces of drawn ASCII art, a memoryless clock that sends one across the glass every quarter hour or so, and the cells it asks to have painted. No renderer, no terminal, no clock of its own."
license = "MIT"
publish = false

[lib]
name = "critters"
path = "src/lib.rs"

# One dependency, and it is the clock. A critter on the quarter hour is a
# reminder of the time, so the mark it lands on has to be the one the wall
# clock shows: minutes taken from the system clock alone are UTC minutes,
# which are off the hour in Adelaide, Darwin, India and Nepal. chrono is
# already in the binary under russh, so this costs a line here and nothing
# there. Everything else is arithmetic on a clock the caller owns, and the
# generator of random numbers is twenty lines in `rng`.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
