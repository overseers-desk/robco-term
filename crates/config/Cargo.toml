[package]
name = "robco-config"
version = "0.1.0"
edition = "2021"
description = "RobCo Terminal settings: the schema with built-in defaults, atomic TOML I/O, and live file watching."
license = "MIT"
publish = false

[lib]
name = "config"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Reading a profile's JSON import blob format. Only the reading half: the
# writing half is hand-rolled in `profile.rs`, because the export has to
# reproduce `JSON.stringify`'s key order, which is not sorted.
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }
notify = "8"
log = "0.4"

[dev-dependencies]
toml = "1"
tempfile = "3"
