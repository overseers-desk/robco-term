# The proofs this repository cannot make on a development machine, and the
# Linux packages themselves.
#
# Windows: the terminal compiles there (the C++ terminal-core dependency
# needs a native toolchain, so no Linux box can check it); glyph fallback
# finds a face there for a character the bundled font has no glyph for; and
# the release exe carries the settings program inside it, so the Tcl/Tk
# toolchain and the Rust build are one artifact's two halves and cannot
# usefully be green apart. Shaping needs no GPU and no window, so those
# tests run anywhere.
#
# Linux: the tarball and the deb are built here rather than by hand,
# because the glibc a binary is linked against is the oldest system it will
# install on, and a floor set by whichever machine was to hand is no floor
# at all. Every green run leaves both files to download, so shipping does
# not wait on reaching the development machine.
#
# The test suite runs on the development machines before every push.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # ring's build assembles its MSVC objects with nasm.
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      # Static Tcl/Tk from source, the standalone image, the payload zip,
      # and the five ROBCO_* variables the embedded cargo build reads,
      # written to $GITHUB_ENV. Its own named step, so a Tcl/Tk break
      # reads as what it is rather than as a cargo failure.
      - name: build the settings toolchain and payload
        shell: pwsh
        run: ./settings/zipfs/build-selfcontained.ps1 -Embed
      # The standalone image keeps its artifact: the Linux tarball route
      # (`xtask dist --settings-binary`) consumes that shape, and this
      # runner is the only machine proving build-selfcontained.ps1 works.
      - name: name the image robco-settings.exe, the name the sibling spawn looks for
        shell: pwsh
        run: |
          $built = Get-ChildItem -Path settings/dist -Filter 'robco-settings-*.exe' | Select-Object -First 1
          if (-not $built) { throw 'no robco-settings-*.exe produced under settings/dist' }
          Copy-Item $built.FullName 'settings/dist/robco-settings.exe' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: robco-settings-windows-x86_64
          path: settings/dist/robco-settings.exe
      - run: cargo build --release -p robco-app --features embedded-settings
      - run: cargo test --release -p robco-core --test suite fallback
      # The exe must speak before it may ship: a GUI-subsystem binary that
      # dies in startup dies without a console to say so, and this is the
      # only Windows machine that runs it before a tester does.
      # Start-Process -Wait, not a plain invocation: the shell waits only
      # for console binaries, and racing ahead of a GUI-subsystem one both
      # misses its exit code and closes the capture pipe under it.
      - name: the exe answers from the command line
        shell: pwsh
        run: |
          $exe = 'target/release/robco-term.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput version.txt
          if ($p.ExitCode -ne 0) { throw "--version exited $($p.ExitCode)" }
          if (-not (Get-Content version.txt)) { throw '--version printed nothing' }
          $p = Start-Process -FilePath $exe -ArgumentList '--dump-settings' `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput dump.txt
          if ($p.ExitCode -ne 0) { throw "--dump-settings exited $($p.ExitCode)" }
          if (-not (Get-Content dump.txt)) { throw '--dump-settings printed nothing' }
      # The embedded payload proves itself without a window: mount, source,
      # and the pure-Tcl suites, inside the shipped exe.
      - name: the settings payload answers from inside the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/robco-term.exe `
            -ArgumentList '--settings-selftest' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) {
              $log = Join-Path $env:LOCALAPPDATA 'robco-term/settings.log'
              if (Test-Path $log) { Get-Content $log }
              throw "--settings-selftest exited $($p.ExitCode)"
          }
          if (-not (Select-String -Path selftest.txt -Pattern 'settings selftest ok' -Quiet)) {
              throw 'selftest output missing its ok line'
          }
      # The direct regression test for the silent death the owner reported (#14): the
      # settings window must still be alive six seconds after launch. The
      # runner's session has a desktop, so Tk can map a window there; if
      # this proves flaky under Session 0, demote it to continue-on-error
      # rather than deleting it.
      - name: the settings window stays up
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/robco-term.exe `
            -ArgumentList '--settings' -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
              $log = Join-Path $env:LOCALAPPDATA 'robco-term/settings.log'
              if (Test-Path $log) { Get-Content $log }
              throw "the settings window exited within 6s (code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force
      # The runner is this project's only Windows build machine, so what it
      # builds is the product, kept, not a proof discarded: every green run
      # carries the one self-contained exe a tester can download and launch.
      - uses: actions/upload-artifact@v4
        with:
          name: robco-term-windows-x86_64
          path: target/release/robco-term.exe

  # macOS holds green, so it gates like every other job. ring needs no
  # nasm here (its macOS assembly builds with the toolchain's own as), and
  # the settings image's build-selfcontained.sh carries the macOS arms.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p robco-app
      - run: cargo test --release -p robco-core --test suite fallback
      # The pointer path is the one place where the two platforms disagree on
      # purpose: Control with the left button is the secondary click here and
      # a selection everywhere else, so the arm that says so runs nowhere but
      # this runner.
      - run: "cargo test --release -p robco-app --test suite pointer::"
      - name: the binary answers from the command line
        run: |
          ./target/release/robco-term --version
          ./target/release/robco-term --dump-settings > /dev/null
      - name: build the self-contained settings image
        run: BUILD_DIR="$RUNNER_TEMP/robco-settings-build" bash settings/zipfs/build-selfcontained.sh
      # The download a Mac user expects: an app with a name and an icon,
      # inside the disk image they drag to Applications. The runner is the
      # only machine here that has hdiutil and codesign, so this is also
      # the only place the bundle can be assembled at all.
      - name: assemble the app bundle and its disk image
        run: |
          image=$(ls settings/dist/robco-settings-*-macos-* | head -1)
          test -n "$image"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bash packaging/macos/bundle.sh --terminal target/release/robco-term \
            --settings "$image" --version "$version" --out-dir dist
      # The disk image opens, the app inside it is the one Info.plist
      # describes, and its executable runs: what can be proved without a
      # human at the screen. The first launch of a downloaded copy is
      # Gatekeeper's business and is checked on real hardware instead.
      - name: the disk image carries the app it claims
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          app="$mount/RobCo Terminal.app"
          test -d "$app"
          test -L "$mount/Applications"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          "$app/Contents/MacOS/robco-term" --version
          "$app/Contents/MacOS/robco-settings" --version
          hdiutil detach "$mount" -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: robco-term-macos-arm64
          path: dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: robco-settings-macos-arm64
          path: settings/dist/robco-settings-*

  # The Linux packages, built on the machine that decides who can install
  # them. A binary carries the glibc it was linked against and runs on any
  # later one, never an earlier: a deb built on 26.04 asked for
  # GLIBC_2.43 and would not unpack on 25.04. The runner is pinned to the
  # oldest release this project ships to, so the floor is set in one place
  # and `dh_shlibdeps` copies it out of the binary into the package.
  # tcl9.0 and tk9.0 are runtime dependencies written by hand in
  # debian/control, so they need not exist on the build host, and the
  # floor is not held up to their availability.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # debhelper and lintian for the package, the X11 and font headers
      # for the from-source Tcl/Tk the tarball's settings image links.
      - name: install the packaging and Tcl/Tk build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper lintian libx11-dev libxext-dev libxft-dev \
            libfontconfig1-dev libxss-dev zlib1g-dev xvfb
      - name: build the self-contained settings image
        run: BUILD_DIR="$RUNNER_TEMP/robco-settings-build" bash settings/zipfs/build-selfcontained.sh
      # Under Xvfb: the selftest loads Tk, and Tk on X11 will not
      # initialise without a display, so a headless runner fails the one
      # check that asks whether Tk registered. The macOS runner has a
      # window server and needs no such wrapper.
      - name: prove the image
        run: |
          image=$(ls settings/dist/robco-settings-*-linux-* | head -1)
          test -n "$image"
          xvfb-run -a "$image" --selftest | tee selftest.txt
          grep -q 'settings selftest ok' selftest.txt
      - name: roll the tarball
        run: |
          image=$(ls settings/dist/robco-settings-*-linux-* | head -1)
          cargo run -p xtask -- dist --out-dir dist --settings-binary "$image"
      # dpkg-buildpackage writes beside the source tree, its own convention.
      - name: build the Debian package
        run: dpkg-buildpackage -us -uc -b
      # The release checklist's own lintian step, with the findings it
      # accepts named: two missing manual pages, and a distribution
      # vocabulary that is Ubuntu's rather than Debian's. It reads the
      # .changes file, which names the deb as a sibling, so it runs while
      # the two still sit together.
      - name: lintian
        run: lintian --suppress-tags no-manual-page,bad-distribution-in-changes-file ../robco-term_*.changes
      # The floor, read back out of the package that carries it. A libc6
      # version here above the oldest supported release is the bug this
      # job exists to keep out, and the log is where it shows. The deb
      # then moves into dist/, because an upload reaches nothing above the
      # workspace.
      - name: read the dependencies back out, and collect the package
        run: |
          dpkg-deb -f ../robco-term_*_amd64.deb Depends
          mv ../robco-term_*_amd64.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: robco-term-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
