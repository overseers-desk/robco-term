# Ships every platform's artifacts for a tagged release. Pushing a `v*` tag
# is the only trigger, so this never touches a tag already cut: a release
# published before a job existed here keeps the assets it went out with.
#
# The Windows asset is one self-contained exe: the settings program's
# archive and a static Tcl/Tk live inside the terminal binary (`--features
# embedded-settings`), and right-click re-executes that same file with
# `--settings`. There is no second file to co-locate, so the download is
# bare. macOS ships a disk image carrying the app bundle, Linux a deb and a
# self-contained tarball.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # The tag names the assets, Cargo.toml names the binary and
  # debian/changelog names the deb. The three agree, or nothing is built.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends dpkg-dev
      - name: the tag, Cargo.toml and debian/changelog name one version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "robco-app") | .version')"
          deb="$(dpkg-parsechangelog -S Version)"
          echo "tag $tag, Cargo.toml $cargo, debian/changelog $deb"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$deb" ]

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      # Builds static Tcl/Tk, proves the standalone image, writes the
      # payload zip, and hands the five ROBCO_* variables the cargo build
      # below reads to $GITHUB_ENV.
      - name: build the settings toolchain and payload
        shell: pwsh
        run: ./settings/zipfs/build-selfcontained.ps1 -Embed
      - run: cargo build --release -p robco-app --features embedded-settings
      - name: prove the payload inside the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/robco-term.exe `
            -ArgumentList '--settings-selftest' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "--settings-selftest exited $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.txt -Pattern 'settings selftest ok' -Quiet)) {
              throw 'selftest output missing its ok line'
          }
      - name: name the exe for the release page
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exe = "robco-term-$version-windows-x86_64.exe"
          Copy-Item target/release/robco-term.exe $exe -Force
          "EXE_PATH=$exe" >> $env:GITHUB_ENV
      # docs/release.md's Publish step creates the release in the same
      # breath as the tag push that triggers this job, so the release
      # usually exists by the time the build above finishes; the wait below
      # covers the case where this job wins that race.
      - name: attach the exe to this tag's release, once one exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          for ($i = 0; $i -lt 20; $i++) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 15
          }
          gh release upload $tag "$env:EXE_PATH" --clobber

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p robco-app
      - name: build the self-contained settings image
        run: BUILD_DIR="$RUNNER_TEMP/robco-settings-build" bash settings/zipfs/build-selfcontained.sh
      # The image proves its payload the same way the Windows exe does,
      # before it may ship inside the app bundle.
      - name: prove the image
        run: |
          image=$(ls settings/dist/robco-settings-*-macos-* | head -1)
          test -n "$image"
          "$image" --selftest | tee selftest.txt
          grep -q 'settings selftest ok' selftest.txt
      # The macOS asset is the disk image: an app with a name and an icon,
      # both binaries inside it, built by the same script CI proves on
      # every push to main.
      - name: bundle the app and its disk image
        run: |
          image=$(ls settings/dist/robco-settings-*-macos-* | head -1)
          version="${GITHUB_REF_NAME#v}"
          bash packaging/macos/bundle.sh --terminal target/release/robco-term \
            --settings "$image" --version "$version" --out-dir dist
          echo "DMG_PATH=dist/robco-term-$version-macos-arm64.dmg" >> "$GITHUB_ENV"
      - name: attach the disk image to this tag's release, once one exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber

  # The Linux half: the tarball and the deb, attached to the tag's
  # release by the same push that builds the other two platforms. The
  # runner is pinned rather than latest because the glibc a binary is
  # linked against is the oldest system it will install on, and that
  # floor belongs to a decision recorded here, not to whichever machine
  # happened to run the build.
  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install the packaging and Tcl/Tk build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper lintian libx11-dev libxext-dev libxft-dev \
            libfontconfig1-dev libxss-dev zlib1g-dev xvfb
      - name: build the self-contained settings image
        run: BUILD_DIR="$RUNNER_TEMP/robco-settings-build" bash settings/zipfs/build-selfcontained.sh
      # Under Xvfb: the selftest loads Tk, and Tk on X11 will not
      # initialise without a display, so a headless runner fails the one
      # check that asks whether Tk registered. The macOS runner has a
      # window server and needs no such wrapper.
      - name: prove the image
        run: |
          image=$(ls settings/dist/robco-settings-*-linux-* | head -1)
          test -n "$image"
          xvfb-run -a "$image" --selftest | tee selftest.txt
          grep -q 'settings selftest ok' selftest.txt
      - name: roll the tarball
        run: |
          image=$(ls settings/dist/robco-settings-*-linux-* | head -1)
          cargo run -p xtask -- dist --out-dir dist --settings-binary "$image"
      - name: build the Debian package
        run: dpkg-buildpackage -us -uc -b
      # lintian reads the .changes, which names the deb as a sibling, so
      # it runs before the deb moves into the workspace for upload.
      - name: lintian
        run: lintian --suppress-tags no-manual-page,bad-distribution-in-changes-file ../robco-term_*.changes
      - name: read the dependencies back out, and collect the package
        run: |
          dpkg-deb -f ../robco-term_*_amd64.deb Depends
          mv ../robco-term_*_amd64.deb dist/
      - name: attach the tarball and the deb to this tag's release, once one exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb --clobber
